name: Build Xiaomi 11T Pro (vili) kpsTechXecl

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  DEVICE_NAME: "xiaomi_11TPro"
  DEVICE_CODENAME: "vili"
  KERNEL_ARCH: "arm64"
  KERNEL_REPO: "LineageOS/android_kernel_xiaomi_sm8350"
  KERNEL_BRANCH: "lineage-24.0"
  DEFCONFIG_NAME: "vendor/lahaina-qgki_defconfig"
  OUTPUT_DIR: "out"
  CLANG_DIR: "${{ github.workspace }}/clang"
  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  KERNEL_DIR: "${{ github.workspace }}/kernel"
  SUSFS_PATCH_FILE: "susfs_patch_to_5.4.patch"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Checkout Workflow Repo (Patches)
        uses: actions/checkout@v4
        with:
          path: workflow_repo
          fetch-depth: 1

      - name: Verify Kernel Commit & Clean Workspace
        working-directory: kernel
        run: |
          echo "=== Kernel source git info ==="
          echo "Branch: ${{ env.KERNEL_BRANCH }}"
          echo "Latest commit: $(git log --oneline -1)"
          echo "Commit hash: $(git rev-parse HEAD)"
          git reset --hard HEAD
          git clean -fdx
          echo "Clean done."

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libelf-dev libssl-dev libncurses-dev \
            make python3 device-tree-compiler git curl xz-utils \
            ccache zip unzip zstd
          if ! sudo apt-get install -y libtinfo5; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi

      - name: Download Clang 18.1.8
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          curl -L --retry 3 -o clang.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
          tar -xf clang.tar.xz -C ${{ env.CLANG_DIR }} --strip-components=1
          rm clang.tar.xz
          ${{ env.CLANG_DIR }}/bin/clang --version

      - name: Apply SUSFS Core Patch
        working-directory: kernel
        run: |
          PATCH="${{ github.workspace }}/workflow_repo/Patches/Patch/${{ env.SUSFS_PATCH_FILE }}"
          echo "Applying SUSFS core patch: $PATCH"
          patch -p1 -N --batch --forward --no-backup-if-mismatch < "$PATCH" || true
          echo "=== .rej files (rejected hunks) ==="
          find . -name "*.rej" | head -50 || true
          echo "=== verify fs/susfs.c exists ==="
          ls -la fs/susfs.c 2>/dev/null || echo "(fs/susfs.c missing)"

      - name: Manual integrate BakaSU into Kernel
        working-directory: kernel
        run: |
          set -e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== Pull latest BakaSU ==="
          rm -rf BakaSU_src
          git clone --depth=1 https://github.com/Baka-SU/BakaSU.git BakaSU_src
          echo "BakaSU HEAD: $(cd BakaSU_src && git log --oneline -1)"

          if [ ! -f "include/linux/seccomp_types.h" ]; then
            touch "include/linux/seccomp_types.h"
          fi

          rm -rf KernelSU
          rm -rf drivers/kernelsu
          rm -rf drivers/KernelSU

          ln -sf ../BakaSU_src/kernel drivers/kernelsu
          echo "Symlink: $(readlink -f drivers/kernelsu)"

          if ! grep -q "kernelsu" drivers/Makefile; then
            printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          fi

          if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            sed -i '/^endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

          # BakaSU non-GKI fix: inject global symbols for selinux_hide.c
          KSU_SRC_DIR=$(readlink -f drivers/kernelsu)
          HIDE_FILE=$(find "$KSU_SRC_DIR" -name 'selinux_hide.c' | head -n1)
          if [ -z "$HIDE_FILE" ]; then
            echo "::error::selinux_hide.c not found"
            exit 1
          fi
          sed -i '/BakaSU non-GKI 修复/,+3d' "$HIDE_FILE"
          sed -i '/static struct mutex \*ksu_selinux_status_lock/d' "$HIDE_FILE"
          sed -i '/static struct selinux_state fake_state/d' "$HIDE_FILE"
          LAST_INCLUDE_LINE=$(grep -n '^#include' "$HIDE_FILE" | tail -n1 | cut -d: -f1)
          [ -z "$LAST_INCLUDE_LINE" ] && LAST_INCLUDE_LINE=1
          sed -i "${LAST_INCLUDE_LINE}r /dev/stdin" "$HIDE_FILE" << 'EOF'

          /* === BakaSU non-GKI 修复：全局符号定义 === */
          struct selinux_state fake_state;
          struct mutex *ksu_selinux_status_lock = NULL;
          EOF

          HIDE_DIR=$(dirname "$HIDE_FILE")
          SELINUX_MK="$HIDE_DIR/Makefile"
          if [ ! -f "$SELINUX_MK" ]; then
            SEARCH_DIR="$HIDE_DIR"
            while [ "$SEARCH_DIR" != "." ] && [ "$SEARCH_DIR" != "/" ] && [ "$SEARCH_DIR" != "$KSU_SRC_DIR" ]; do
              if [ -f "$SEARCH_DIR/Makefile" ]; then
                SELINUX_MK="$SEARCH_DIR/Makefile"
                break
              fi
              SEARCH_DIR=$(dirname "$SEARCH_DIR")
            done
          fi
          if [ -n "$SELINUX_MK" ] && [ -f "$SELINUX_MK" ]; then
            MK_DIR=$(dirname "$SELINUX_MK")
            HIDE_REL=$(realpath --relative-to="$MK_DIR" "$HIDE_FILE")
            HIDE_OBJ="${HIDE_REL%.c}.o"
            if ! grep -q "$HIDE_OBJ" "$SELINUX_MK"; then
              echo "obj-y += $HIDE_OBJ" >> "$SELINUX_MK"
            fi
          fi

          echo "=== Apply SUSFS inline-hook patches (adds ksu_handle_setresuid etc.) ==="
          bash "${{ github.workspace }}/workflow_repo/Patches/susfs_inline_hook_patches.sh" || true

          echo "=== Fix stat.c: script injected 'flag' instead of 'flags' ==="
          sed -i 's/ksu_handle_stat(&dfd, &fname, &flag)/ksu_handle_stat(\&dfd, \&fname, \&flags)/' fs/stat.c
          grep -n "ksu_handle_stat" fs/stat.c || true

          echo "=== Verify ksu_handle_setresuid present in kernel/sys.c ==="
          grep -n "ksu_handle_setresuid" kernel/sys.c || echo "(WARN: setresuid hook not found)"

          ccache -C

          # Fix LineageOS source quirk: focaltech_3680 Makefile uses spaces (breaks make)
          FOCALTECH_MAKEFILE="drivers/input/touchscreen/focaltech_3680/Makefile"
          if [ -f "$FOCALTECH_MAKEFILE" ]; then
            sed -i 's/^ \+/\t/' "$FOCALTECH_MAKEFILE"
            echo "Fixed $FOCALTECH_MAKEFILE (spaces -> tabs)"
          fi

          # Suppress noisy warnings in a few Makefiles (avoid -Werror failures)
          for entry in \
            "drivers/soc/qcom/Makefile:-Wno-unused-variable" \
            "drivers/thermal/Makefile:-Wno-fortify-source" \
            "techpack/bootinfo/Makefile:-Wno-unused-result" \
            "drivers/usb/dwc3/Makefile:-Wno-unused-label"; do
              MK="${entry%:*}"
              FLAG="${entry#*:}"
              if [ -f "$MK" ] && ! grep -q -- "$FLAG" "$MK" 2>/dev/null; then
                echo "ccflags-y += $FLAG" >> "$MK"
              fi
          done

          echo "=== Prepare .config (lahaina-qgki + vili + xiaomi fragments) ==="
          rm -rf ${{ env.OUTPUT_DIR }}
          rm -f .config
          make mrproper

          make -j$(nproc) O=${{ env.OUTPUT_DIR }} ${{ env.DEFCONFIG_NAME }}
          if [ ! -f "${{ env.OUTPUT_DIR }}/.config" ]; then
            echo "::error::make defconfig failed"
            exit 1
          fi

          # Merge vili + xiaomi QGKI fragments (device-specific config)
          ./scripts/kconfig/merge_config.sh -O ${{ env.OUTPUT_DIR }} -m ${{ env.OUTPUT_DIR }}/.config \
            arch/arm64/configs/vendor/vili_QGKI.config \
            arch/arm64/configs/vendor/xiaomi_QGKI.config

          echo "=== Enable BakaSU + SUSFS configs ==="
          scripts/config --file ${{ env.OUTPUT_DIR }}/.config \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --disable KSU_TRACEPOINT_HOOK \
            --enable KSU_COMPAT_HAS_SELINUX_STATE \
            --enable KSU_COMPAT_HAS_KVMALLOC \
            --enable KSU_SUSFS \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SUS_MAP \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_SUS_SU \
            --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --disable KSU_SUSFS_ENABLE_LOG \
            --disable HEADERS_INSTALL \
            --disable LTO_CLANG \
            --disable CFI_CLANG \
            --set-str LOCALVERSION "-kpsTechXecl" \
            --set-val FRAME_WARN 131072

          make O=${{ env.OUTPUT_DIR }} olddefconfig 2>&1 | tee olddefconfig.log

          if ! grep -q "CONFIG_KSU=y" ${{ env.OUTPUT_DIR }}/.config; then
            echo "::error::CONFIG_KSU not enabled"
            exit 1
          fi
          grep "CONFIG_LOCALVERSION=" ${{ env.OUTPUT_DIR }}/.config || true

      - name: Build Kernel
        working-directory: kernel
        run: |
          set +e
          export ARCH=${{ env.KERNEL_ARCH }}
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          ccache -M 6G
          export LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- \
                 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== Build ==="
          make -j$(nproc) O=${{ env.OUTPUT_DIR }} \
               KCFLAGS="-Wno-error -Wframe-larger-than=131072 -Wno-strict-prototypes -Wno-align-mismatch -Wno-unused-function -Wno-compare-distinct-pointer-types -Wno-void-pointer-to-int-cast -Wno-array-parameter -Wno-declaration-after-statement -Wno-sometimes-uninitialized -Wno-unused-variable -Wno-misleading-indentation -Wno-fortify-source -Wno-macro-redefined -Wno-unused-result -Wno-unused-label" \
               HOSTCFLAGS="" \
               2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "::error::Build failed, exit $BUILD_STATUS"
            exit 1
          fi

          if [ ! -f "${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "::error::Image not generated"
            exit 1
          fi

          md5sum ${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image
          strings ${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image | grep "Linux version" | head -n 1
          echo "Build success."

      - name: Package AnyKernel3
        id: package
        run: |
          set -e
          TIME=$(date +"%Y.%m.%d-%H%M")
          AK3_DIR="AnyKernel3"
          IMG_PATH="${{ env.KERNEL_DIR }}/${{ env.OUTPUT_DIR }}/arch/arm64/boot/Image"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $AK3_DIR
          gzip -9 -c "$IMG_PATH" > "$AK3_DIR/Image.gz"

          printf '%s\n' \
            '#!/sbin/sh' \
            '' \
            '### AnyKernel3 Flashable Kernel Script' \
            '## Xiaomi 11T Pro (vili) with BakaSU' \
            '' \
            "properties() { '" \
            'kernel.string=5.4.302-kpsTechXecl BakaSU for Xiaomi 11T Pro' \
            'do.devicecheck=1' \
            'do.modules=0' \
            'do.systemless=0' \
            'do.cleanup=1' \
            'do.cleanuponabort=0' \
            'device.name1=vili' \
            'device.name2=' \
            'device.name3=' \
            'device.name4=' \
            'device.name5=' \
            'supported.versions=' \
            'supported.patchlevels=' \
            'supported.vendorpatchlevels=' \
            "'; } # end properties" \
            '' \
            'BLOCK=boot;' \
            'IS_SLOT_DEVICE=1;' \
            'RAMDISK_COMPRESSION=auto;' \
            'PATCH_VBMETA_FLAG=auto;' \
            '' \
            '. tools/ak3-core.sh;' \
            '' \
            'split_boot;' \
            'flash_boot;' \
            > "$AK3_DIR/anykernel.sh"

          chmod +x "$AK3_DIR/anykernel.sh"
          cd $AK3_DIR
          zip -r9 "../${{ env.DEVICE_CODENAME }}-kpsTechXecl-BakaSU-${TIME}.zip" ./*
          cd ..
          echo "zip_name=${{ env.DEVICE_CODENAME }}-kpsTechXecl-BakaSU-${TIME}.zip" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vili-kpsTechXecl-BakaSU
          path: ${{ env.DEVICE_CODENAME }}-kpsTechXecl-BakaSU-*.zip

      - name: Upload build.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build_log
          path: kernel/build.log
          if-no-files-found: ignore

      - name: Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vili_kpsTechXecl_${{ github.run_number }}
          name: "Xiaomi 11T Pro (vili) kpsTechXecl BakaSU Kernel"
          body: |
            ## Xiaomi 11T Pro (vili) — 5.4.302-kpsTechXecl
            - 基于 LineageOS sm8350 (lineage-24.0 / Android 17)
            - BakaSU + SuSFS 全套（SELinux 隐藏、路径/挂载/maps 隐藏）
            - 适用于 DerpFest v17 等 AOSP 类 ROM
            - 刷入前请备份当前 boot 分区
          files: ${{ env.DEVICE_CODENAME }}-kpsTechXecl-BakaSU-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
